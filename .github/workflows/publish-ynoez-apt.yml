name: Build and publish ynoez APT repository

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-tweaks/packages/**"
      - "ios-tweaks/pool/**/*.deb"
      - ".github/workflows/publish-ynoez-apt.yml"

permissions:
  contents: write

jobs:
  build-index-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ynoez package
        run: |
          mkdir -p build
          chmod 0755 ios-tweaks/packages/ynoez-audit/var/jb/usr/bin/ynoez-audit
          dpkg-deb --build --root-owner-group ios-tweaks/packages/ynoez-audit build/com.ynoez.audit_0.1.0_iphoneos-arm64.deb
      - name: Add authorized package files
        run: |
          mkdir -p public/pool
          cp build/*.deb public/pool/
          if [ -d ios-tweaks/pool ]; then
            find ios-tweaks/pool -type f -name '*.deb' -exec cp {} public/pool/ \;
          fi
      - name: Generate APT metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils
          cd public
          dpkg-scanpackages --multiversion --arch iphoneos-arm64 pool /dev/null > Packages
          test -s Packages
          gzip -9c Packages > Packages.gz
          xz -9e -c Packages > Packages.xz
          apt-ftparchive release . > Release
      - name: Publish repository files to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: false
          commit_message: "Build and publish ynoez APT repository"

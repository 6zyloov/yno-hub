name: Build and publish ynoez APT repository

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-tweaks/packages/**"
      - "ios-tweaks/pool/**/*.deb"
      - ".github/workflows/publish-ynoez-apt.yml"

permissions:
  contents: write

jobs:
  build-index-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil dpkg-dev apt-utils
      - name: Build ynoez audit
        run: |
          mkdir -p build
          chmod 0755 ios-tweaks/packages/ynoez-audit/var/jb/usr/bin/ynoez-audit
          dpkg-deb --build --root-owner-group ios-tweaks/packages/ynoez-audit build/com.ynoez.audit_0.1.0_iphoneos-arm64.deb
      - name: Generate ynoez noir SnowBoard icons
        run: |
          python3 ios-tweaks/packages/ynoez-noir/build_theme.py
          test "$(find 'ios-tweaks/packages/ynoez-noir/var/jb/Library/Themes/ynoez noir.theme/IconBundles' -name '*-large.png' | wc -l)" -eq 28
      - name: Build ynoez noir theme package
        run: |
          dpkg-deb --build --root-owner-group ios-tweaks/packages/ynoez-noir build/com.ynoez.noir_1.0.0_iphoneos-arm64.deb
      - name: Upload installable Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: ynoez-rootless-debs
          path: build/*.deb
          if-no-files-found: error
          retention-days: 30
      - name: Assemble APT pool
        run: |
          mkdir -p public/pool
          cp build/*.deb public/pool/
          if [ -d ios-tweaks/pool ]; then
            find ios-tweaks/pool -type f -name '*.deb' -exec cp {} public/pool/ \;
          fi
      - name: Generate APT metadata
        run: |
          cd public
          dpkg-scanpackages --multiversion --arch iphoneos-arm64 pool /dev/null > Packages
          test -s Packages
          gzip -9c Packages > Packages.gz
          xz -9e -c Packages > Packages.xz
          apt-ftparchive release . > Release
      - name: Publish repository files to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: false
          commit_message: "Build and publish ynoez APT repository"

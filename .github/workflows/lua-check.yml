name: lua syntax check

on:
  push:
    paths:
      - '**.lua'
  pull_request:
    paths:
      - '**.lua'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: |
          luac5.4 -p yno.lua
          luac5.4 -p scripts/static-check.lua
      - name: Run static wiring checks
        run: lua5.4 scripts/static-check.lua yno.lua

name: Validate ynoez iOS catalog

on:
  push:
    paths:
      - "ios-tweaks/**"
  pull_request:
    paths:
      - "ios-tweaks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog JSON and target
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("ios-tweaks/catalog.json").read_text(encoding="utf-8"))
          target = data["target"]
          assert data["name"] == "ynoez"
          assert target["product_identifier"] == "iPhone8,2"
          assert target["ios"] == "15.8.8"
          assert target["jailbreak"] == "Dopamine"
          assert target["jailbreak_mode"] == "rootless"
          assert target["debian_architecture"] == "iphoneos-arm64"
          assert target["install_prefix"] == "/var/jb"
          assert data["sileo_apt_repository_live"] is False
          ids = [item["package_id"] for item in data["ynoez_packages"]]
          assert len(ids) == len(set(ids))
          noir = next(item for item in data["ynoez_packages"] if item["package_id"] == "com.ynoez.noir")
          assert noir["version"] == "1.0.0"
          assert any(item["package_id"] == "com.ynoez.audit" for item in data["ynoez_packages"])
          print(f"Validated {len(data['items'])} catalog entries and {len(ids)} ynoez packages.")
          PY
      - name: Validate theme source and package metadata
        run: |
          python3 -m py_compile ios-tweaks/packages/ynoez-noir/build_theme.py
          python3 - <<'PY'
          import plistlib, re
          from pathlib import Path
          control = Path("ios-tweaks/packages/ynoez-noir/DEBIAN/control").read_text()
          assert "Package: com.ynoez.noir" in control
          assert "Architecture: iphoneos-arm64" in control
          assert "Depends: com.spark.snowboard" in control
          plist = Path("ios-tweaks/packages/ynoez-noir/var/jb/Library/Themes/ynoez noir.theme/Info.plist")
          info = plistlib.loads(plist.read_bytes())
          assert info["PackageName"] == "ynoez noir"
          source = Path("ios-tweaks/packages/ynoez-noir/build_theme.py").read_text()
          block = source.split("icons = {", 1)[1].split("}", 1)[0]
          assert len(re.findall(r'^\\s+"[^"]+":"[^"]+"', block, re.M)) == 28
          print("Validated ynoez noir plist, Rootless metadata and 28 icon mappings.")
          PY
          sh -n ios-tweaks/packages/ynoez-audit/var/jb/usr/bin/ynoez-audit
      - name: Check required documentation
        run: |
          test -s ios-tweaks/README.md
          test -s ios-tweaks/SILEO-SOURCES.md
          test -s ios-tweaks/PERFORMANCE.md
          test -s ios-tweaks/DEVELOPMENT.md

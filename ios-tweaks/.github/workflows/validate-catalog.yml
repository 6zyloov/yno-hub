name: Validate ynoez iOS catalog

on:
  push:
    paths:
      - "ios-tweaks/**"
  pull_request:
    paths:
      - "ios-tweaks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog JSON and target
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("ios-tweaks/catalog.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          target = data["target"]
          assert data["name"] == "ynoez"
          assert target["product_identifier"] == "iPhone8,2"
          assert target["ios"] == "15.8.8"
          assert target["jailbreak"] == "Dopamine"
          assert target["jailbreak_mode"] == "rootless"
          assert target["debian_architecture"] == "iphoneos-arm64"
          assert target["install_prefix"] == "/var/jb"
          assert data["sileo_apt_repository_live"] is False
          ids = [p["package_id"] for p in data["ynoez_packages"]]
          assert len(ids) == len(set(ids)), "duplicate ynoez package ID"
          print(f"Validated {len(data['items'])} catalog entries and {len(ids)} planned ynoez packages.")
          PY
      - name: Check required documentation
        run: |
          test -s ios-tweaks/README.md
          test -s ios-tweaks/SILEO-SOURCES.md
          test -s ios-tweaks/PERFORMANCE.md
          test -s ios-tweaks/DEVELOPMENT.md
